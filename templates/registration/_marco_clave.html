{% load static %}
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Hato Grande{% endblock %}</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#123f2a;
    font:16px/1.55 system-ui,sans-serif; color:#17261E; }
  .tarjeta { width:min(94vw,440px); background:#fff; border-radius:16px; padding:1.9rem 1.7rem; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  .marca { display:flex; align-items:center; gap:.6rem; margin-bottom:1.1rem; }
  .marca img { width:46px; height:46px; object-fit:contain; }
  .marca strong { color:#1E5A3C; }
  h1 { font-size:1.25rem; margin:.2rem 0 .8rem; }
  p { color:#3d4a43; }
  label { display:block; font-weight:600; font-size:.9rem; margin:.8rem 0 .25rem; }
  input { width:100%; padding:.65rem .7rem; border:1px solid #D8E2DC; border-radius:9px; font:inherit; }
  button { width:100%; margin-top:1.1rem; padding:.7rem; border:0; border-radius:9px; font:inherit; font-weight:700; background:#1E5A3C; color:#fff; cursor:pointer; }
  button:hover { background:#164430; }
  .errorlist { color:#B3263E; font-size:.85rem; padding-left:1.1rem; }
  a { color:#1E5A3C; }
</style>
</head>
<body>
<div class="tarjeta">
  <div class="marca"><img src="{% static 'img/logo_hatogrande.png' %}" alt=""><strong>Hato Grande</strong></div>
  {% block contenido %}{% endblock %}
</div>
</body>
</html>
